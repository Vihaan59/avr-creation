<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Scanner - Raghu Cyber Centre Pro</title><link rel="stylesheet" href="./styles.css"></head><body data-page="other"><div data-header></div><main class="container"><section class="card"><h1>🔎 QR Scanner</h1><p class="muted">Camera QR scanning when supported by your browser.</p><video id="video" playsinline style="width:100%;max-width:500px;border-radius:12px;background:#111"></video><p id="qr" class="notice">Ready.</p><button class="btn" onclick="scanQR()">Start Camera</button></section><script>async function scanQR(){if(!("BarcodeDetector" in window)){qr.textContent="ಈ browser QR scanner support ಮಾಡುತ್ತಿಲ್ಲ.";return}try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});video.srcObject=s;await video.play();let d=new BarcodeDetector({formats:["qr_code"]});async function f(){let c=await d.detect(video);if(c.length){qr.textContent="QR Result: "+c[0].rawValue;s.getTracks().forEach(t=>t.stop());return}requestAnimationFrame(f)}f()}catch(e){qr.textContent="Camera permission ಬೇಕು."}}</script></main><footer>© 2026 Raghu Cyber Centre Pro</footer><script src="./app.js"></script></body></html>
