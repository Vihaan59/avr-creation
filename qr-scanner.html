<!doctype html><html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Scanner</title>
<style>body{font-family:Arial;background:#f3f7ff;padding:20px;text-align:center}.box{background:#fff;padding:20px;border-radius:16px;max-width:600px;margin:auto}button{padding:12px 18px;border:0;border-radius:9px;background:#087dd2;color:#fff;font-weight:700}video{width:100%;max-width:450px;border-radius:12px;margin:15px 0}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd5e3;border-radius:9px}</style></head>
<body><div class="box"><h2>🔳 QR Scanner</h2><p>Camera permission ಕೊಟ್ಟರೆ QR scan ಮಾಡಬಹುದು. ಈ page payment confirmation ಮಾಡೋದಿಲ್ಲ; UTR ಅನ್ನು customer/admin pageನಲ್ಲಿ verify ಮಾಡಬೇಕು.</p><video id="video" playsinline></video><button onclick="startScan()">Start Camera</button><p id="result"></p><a href="index.html">Back to Website</a></div>
<script>
async function startScan(){if(!("BarcodeDetector" in window))return result.textContent="ಈ browser QR BarcodeDetector support ಮಾಡುತ್ತಿಲ್ಲ. UTR manually use ಮಾಡಿ.";try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});video.srcObject=stream;await video.play();let d=new BarcodeDetector({formats:["qr_code"]});async function loop(){try{let codes=await d.detect(video);if(codes.length){result.textContent="QR Result: "+codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());return}}catch(e){}requestAnimationFrame(loop)}loop()}catch(e){result.textContent="Camera permission ಬೇಕು.";}}</script></body></html>
