<!DOCTYPE html><html lang="kn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raghu Cyber Centre - QR Scanner</title>
<style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#17233d}.head{background:#071b49;color:#fff;padding:16px}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 18px #173b6418}video{width:100%;border-radius:14px;background:#111}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;margin:6px 4px 0 0}.blue{background:#087dd2;color:#fff}.gray{background:#e9edf3}.notice{padding:12px;background:#fff5d8;border-radius:10px;margin-top:12px;word-break:break-all}</style></head>
<body><div class="head"><b>📷 RAGHU CYBER CENTRE PRO</b><div>QR Scanner</div></div><div class="wrap"><div class="card"><h2>Scan QR Code</h2><video id="v" playsinline></video><button class="btn blue" onclick="start()">Start Camera</button><button class="btn gray" onclick="stop()">Stop</button><div id="out" class="notice">Ready.</div></div></div>
<script>let s,t;async function start(){let o=document.getElementById('out');if(!('BarcodeDetector'in window)){o.textContent='QR scanner support ಇಲ್ಲ. Chrome update ಮಾಡಿ.';return}try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});v.srcObject=s;await v.play();let d=new BarcodeDetector({formats:['qr_code']});t=setInterval(async()=>{try{let c=await d.detect(v);if(c.length){o.textContent=c[0].rawValue;stop()}}catch(e){}},400)}catch(e){o.textContent='Camera permission denied ಅಥವಾ camera unavailable.'}}function stop(){if(t)clearInterval(t);t=null;if(s)s.getTracks().forEach(x=>x.stop());s=null;v.srcObject=null}</script></body></html>
