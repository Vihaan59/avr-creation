<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raghu Cyber Centre Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(460px,92%);text-align:center}.brand{background:linear-gradient(90deg,#7b0b86,#008fd1);color:#fff;padding:18px;border-radius:14px 14px 0 0;font-weight:700;font-size:21px}
.card{background:#fff;padding:28px 22px;border-radius:0 0 14px 14px;box-shadow:0 3px 18px #0002}.logo{font-size:42px;margin:4px}.sub{color:#667085;margin:8px 0 25px}.btn{display:block;width:100%;padding:13px 16px;margin:12px 0;border:0;border-radius:8px;color:#fff;font-size:16px;font-weight:600;text-decoration:none}.customer{background:#008fd1}.admin{background:#24354a}.create{background:#18a81a}.small{margin-top:18px;color:#718096;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🟢 RAGHU CYBER CENTRE PRO</div>
  <div class="card">
    <div class="logo">🔐</div>
    <h2>Login Required</h2>
    <p class="sub">Please login before using the dashboard and services.</p>
    <a class="btn customer" href="./login.html">👤 Customer Login</a>
    <a class="btn admin" href="./admin.html">🛡️ Admin Login</a>
    <p class="small">Dashboard and all services are available after login.</p>
  </div>
</div>
</body>
</html>
