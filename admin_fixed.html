<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raghu Admin</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="p-3 bg-light"><div class="d-flex justify-content-between align-items-center mb-3"><h3>🟢 RAGHU CYBER CENTRE PRO — ADMIN</h3><button class="btn btn-outline-primary" onclick="location.href='index.html'">Customer Portal</button></div><div id="out"></div><script>
let d=JSON.parse(localStorage.getItem("rcc")||'{"users":[],"topups":[],"requests":[],"current":null}');d.users=Array.isArray(d.users)?d.users:[];d.topups=Array.isArray(d.topups)?d.topups:[];d.requests=Array.isArray(d.requests)?d.requests:[];
function save(){localStorage.setItem("rcc",JSON.stringify(d));render()}
function render(){out.innerHTML="<div class='card p-3'><h4>Recharge Requests</h4>"+(d.topups.length?d.topups.slice().reverse().map((t,ri)=>{let i=d.topups.length-1-ri;return "<div class='border-bottom p-2'>"+t.m+" — ₹"+t.a+" — <b>"+t.status+"</b>"+(t.status==="Pending"?" <button class='btn btn-sm btn-success' onclick='ok("+i+")'>Approve</button> <button class='btn btn-sm btn-danger' onclick='no("+i+")'>Reject</button>":"")+"</div>"}).join(""):"No recharge requests")+"</div><div class='card p-3 mt-3'><h4>Customers ("+d.users.length+")</h4>"+(d.users.length?d.users.map((u,i)=>"<div class='border-bottom p-2'>"+u.m+" — Wallet ₹"+(u.w||0)+" — <b>"+(u.active===false?"Inactive":"Active")+"</b> <button class='btn btn-sm btn-warning' onclick='de("+i+")'>"+(u.active===false?"Activate":"Deactivate")+"</button></div>").join(""):"No customers")+"</div><div class='card p-3 mt-3'><h4>Service Requests</h4>"+(d.requests.length?d.requests.slice().reverse().map((r,ri)=>{let i=d.requests.length-1-ri;return "<div class='border-bottom p-2'>"+r.m+" — "+r.s+" ₹"+r.f+" — <b>"+r.status+"</b>"+(r.status==="Pending"?" <button class='btn btn-sm btn-success' onclick='done("+i+")'>Complete & Charge</button>":"")+"</div>"}).join(""):"No service requests")+"</div>"}
function ok(i){let t=d.topups[i],u=d.users.find(x=>x.m===t.m);if(!u)return alert("Customer not found");if(t.status!=="Pending")return;u.w=(u.w||0)+Number(t.a);t.status="Approved";save()}
function no(i){if(d.topups[i].status==="Pending"){d.topups[i].status="Rejected";save()}}
function de(i){d.users[i].active=d.users[i].active===false;save()}
function done(i){let r=d.requests[i],u=d.users.find(x=>x.m===r.m);if(!u)return alert("Customer not found");if(r.status!=="Pending")return;if((u.w||0)<Number(r.f))return alert("Insufficient wallet");u.w-=Number(r.f);r.status="Completed";save()}
render();
</script></body></html>
