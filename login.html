<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Raghu Cyber Centre Pro</title><link rel="stylesheet" href="./raghu-fixed.css"></head>
<body><main class="container" style="max-width:480px;margin-top:50px">
<div class="card"><h2>🔐 Raghu Cyber Centre Pro</h2><p>Login</p>
<form id="loginForm"><label>Email</label><input id="email" type="email" required placeholder="Enter email">
<label>Password</label><input id="password" type="password" required placeholder="Enter password">
<button class="btn" type="submit">Login</button></form>
<p id="msg"></p><a href="./index.html">← Back to Dashboard</a></div></main>
<script>
document.getElementById("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 localStorage.setItem("raghu_logged_in","1");
 document.getElementById("msg").textContent="Login details accepted. Opening dashboard...";
 setTimeout(()=>location.href="./index.html",400);
});
</script></body></html>
