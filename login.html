<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login - Raghu Cyber Centre Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(430px,92%)}.brand{background:linear-gradient(90deg,#7b0b86,#008fd1);color:#fff;padding:17px;text-align:center;border-radius:14px 14px 0 0;font-weight:700}
.card{background:#fff;padding:24px;border-radius:0 0 14px 14px;box-shadow:0 3px 18px #0002}h2{text-align:center}label{display:block;margin-top:12px;font-weight:600}input{width:100%;padding:12px;margin-top:6px;border:1px solid #d5dce5;border-radius:7px}.btn{width:100%;padding:12px;margin-top:14px;border:0;border-radius:7px;color:#fff;font-weight:600;font-size:15px}.login{background:#008fd1}.create{background:#18a81a}.back{display:block;text-align:center;margin-top:16px;color:#008fd1;text-decoration:none}.msg{text-align:center;margin-top:10px;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="wrap"><div class="brand">🟢 RAGHU CYBER CENTRE PRO</div>
<div class="card">
<h2>👤 Customer Login</h2>
<form id="loginForm">
<label>Mobile / Email</label><input id="identifier" required placeholder="Enter mobile or email">
<label>Password</label><input id="password" type="password" required placeholder="Enter password">
<button class="btn login" type="submit">Customer Login</button>
</form>
<button class="btn create" id="createBtn" type="button">➕ Create Customer Account</button>
<div class="msg" id="msg"></div>
<a class="back" href="./index.html">← Back</a>
</div></div>
<script>
const form=document.getElementById('loginForm'),msg=document.getElementById('msg');
form.addEventListener('submit',e=>{
 e.preventDefault();
 const id=document.getElementById('identifier').value.trim();
 const pw=document.getElementById('password').value;
 if(!id||!pw)return;
 localStorage.setItem('raghu_logged_in','1');
 localStorage.setItem('raghu_profile',JSON.stringify({identifier:id,role:'customer',active:true}));
 msg.textContent='Login successful. Opening dashboard...';
 setTimeout(()=>location.href='./index.html',250);
});
document.getElementById('createBtn').onclick=()=>{
 const name=prompt('Enter customer name');
 if(!name)return;
 const mobile=prompt('Enter mobile number');
 if(!mobile)return;
 const password=prompt('Create password');
 if(!password)return;
 localStorage.setItem('raghu_logged_in','1');
 localStorage.setItem('raghu_profile',JSON.stringify({full_name:name,mobile:mobile,role:'customer',active:true}));
 msg.textContent='Account created. Opening dashboard...';
 setTimeout(()=>location.href='./index.html',250);
};
</script>
</body></html>
