<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raghu Admin</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body class="p-3 bg-light"><h3>🟢 RAGHU CYBER CENTRE PRO — ADMIN</h3><div id="out"></div><script>let d=JSON.parse(localStorage.getItem("rcc")||"null");if(!d){location.href="index.html"}function save(){localStorage.setItem("rcc",JSON.stringify(d));render()}function render(){out.innerHTML="<div class='card p-3'><h4>Recharge Requests</h4>"+d.topups.map((t,i)=>"<div class='border-bottom p-2'>"+t.m+" — ₹"+t.a+" — "+t.status+(t.status==="Pending"?" <button class='btn btn-sm btn-success' onclick='ok("+i+")'>Approve</button> <button class='btn btn-sm btn-danger' onclick='no("+i+")'>Reject</button>":"")+"</div>").join("")+"</div><div class='card p-3 mt-3'><h4>Customers</h4>"+d.users.map((u,i)=>"<div class='border-bottom p-2'>"+u.m+" — Wallet ₹"+(u.w||0)+" <button class='btn btn-sm btn-warning' onclick='de("+i+")'>"+(u.active===false?"Activate":"Deactivate")+"</button></div>").join("")+"</div><div class='card p-3 mt-3'><h4>Service Requests</h4>"+d.requests.map((r,i)=>"<div class='border-bottom p-2'>"+r.m+" — "+r.s+" ₹"+r.f+" — "+r.status+(r.status==="Pending"?" <button class='btn btn-sm btn-success' onclick='done("+i+")'>Complete & Charge</button>":"")+"</div>").join("")+"</div>"}function ok(i){let t=d.topups[i],u=d.users.find(x=>x.m===t.m);u.w=(u.w||0)+t.a;t.status="Approved";save()}function no(i){d.topups[i].status="Rejected";save()}function de(i){d.users[i].active=d.users[i].active===false;save()}function done(i){let r=d.requests[i],u=d.users.find(x=>x.m===r.m);if((u.w||0)<r.f)return alert("Insufficient wallet");u.w-=r.f;r.status="Completed";save()}render()</script></body></html>
